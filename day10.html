<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="day10_style.css" />
    <title>Styled To-Do List</title>
  </head>

  <body>
    <header>
      <h1>MY TO-DO LIST</h1>
    </header>
    <main>
      <section>
        <ul class="todo-list">
          <li>
            <input type="checkbox" id="first" />
            <label for="first">First List</label>
            <ul class="sub-item">
              <li>
                <a class="sub-item-link" href="subitem1" target="_blank"
                  >Task 1</a
                >
              </li>
            </ul>
          </li>
          <li>
            <input type="checkbox" id="second" />
            <label for="second">Second List</label>
            <ul class="sub-item">
              <li>
                <a class="sub-item-link" href="subitem2" target="_blank"
                  >Task 2</a
                >
              </li>
            </ul>
          </li>
          <li>
            <input type="checkbox" id="third" />
            <label for="third">Third List</label>
            <ul class="sub-item">
              <li>
                <a class="sub-item-link" href="subitem3" target="_blank"
                  >Task 3</a
                >
              </li>
            </ul>
          </li>
          <li>
            <input type="checkbox" id="fourth" />
            <label for="fourth">Fourth List</label>
            <ul class="sub-item">
              <li>
                <a class="sub-item-link" href="subitem4" target="_blank"
                  >Task 4</a
                >
              </li>
            </ul>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
