<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility</title>
</head>
<body>
    <table>
        <caption>Table structure example</caption>
    <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Age</th>
            <th scope="col">Grade</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <th scope="row">Doe</td>
            <td>17</td>
            <td>80</td>
        </tr>
        <tr>
            <td scope="row">James</td>
            <td>19</td>
            <td>79</td>
        </tr>
    </tbody>
    </table>
</body>
</html>
